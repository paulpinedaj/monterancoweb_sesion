<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, shrink-to-fit=no">
    <meta name="description" content="MonteRanco - Estudio de Grabación - Futrono" />
    <meta name="keywords" content="MonteRanco - Estudio de Grabación - Futrono" />
    <meta name="author" content="Paul Pineda - www.skeleton.cl"/>
    <title>MonteRanco - Estudio de Grabación - Futrono</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>

        :root{
            --bg:#000;
            --card:#111;
            --text:#fff;
            --border:#222;
            --hover:#c00000;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:var(--bg);
            color:var(--text);
            font-family:Arial, Helvetica, sans-serif;
            min-height:100vh;
        }

        .container{
            width:100%;
            max-width:1200px;
            margin:auto;
            padding:40px 20px 80px;
        }

        .logo-principal{
            display:block;
            width:220px;
            max-width:75%;
            margin:0 auto 40px;
        }

        h1{
            text-align:center;
            font-size:clamp(1.4rem, 4vw, 3rem);
            font-weight:700;
            letter-spacing:.05em;
            margin-bottom:25px;
            padding:0 10px;
        }

        .video-container{
            position:relative;
            width:100%;
            border-radius:16px;
            overflow:hidden;
            box-shadow:
                0 0 25px rgba(255,255,255,.05),
                0 0 60px rgba(192,0,0,.15);
        }

        .video-container::before{
            content:"";
            display:block;
            padding-top:56.25%;
        }

        .video-container iframe{
            position:absolute;
            top:0;
            left:0;
            width:100%;
            height:100%;
            border:none;
        }

        .section{
            margin-top:60px;
            text-align:center;
        }

        .logo-banda{
            width:280px;
            max-width:85%;
            margin-bottom:25px;
        }

        .logo-estudio{
            width:180px;
            max-width:65%;
            margin-bottom:25px;
        }

        .social-title{
            font-size:1rem;
            letter-spacing:.08em;
            text-transform:uppercase;
            color:#cfcfcf;
            margin-bottom:20px;
        }

        .social{
            display:flex;
            justify-content:center;
            align-items:center;
            flex-wrap:wrap;
            gap:16px;
        }

        .social a{
            width:56px;
            height:56px;
            border:1px solid var(--border);
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            text-decoration:none;
            color:white;
            font-size:24px;
            transition:.25s;
        }

        .social a:hover{
            background:var(--hover);
            border-color:var(--hover);
            transform:translateY(-3px);
        }

        hr{
            border:none;
            height:1px;
            background:#222;
            margin:70px auto;
            max-width:800px;
        }

        .logo-gobierno{
            display:block;
            width:280px;
            max-width:80%;
            margin:80px auto 0;
            opacity:.95;
        }

        @media (max-width:768px){

            .container{
                padding:25px 15px 60px;
            }

            .logo-principal{
                width:170px;
            }s

            .logo-banda{
                width:220px;
            }

            .logo-estudio{
                width:140px;
            }

            .social a{
                width:50px;
                height:50px;
                font-size:20px;
            }

            .social-title{
                font-size:.9rem;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <!-- MONTERANCO -->

        <img
            src="img/logo-monteranco-sesiones.svg"
            alt="MonteRanco"
            class="logo-principal">

        <!-- VIDEO YOUTUBE -->

        <h1>VISIS | SESIÓN EN VIVO</h1>

        <div class="video-container">


<iframe id="player" src="https://www.youtube.com/embed/NXikoUhe9Rc?si=MXVt9GBLxraysfax" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

        </div>

        <!-- BANDA -->

        <section class="section">

            <img
                src="img/logo-visis.svg"
                alt="Visis"
                class="logo-banda">

            <p class="social-title">Sigue las redes de VISIS</p>

            <div class="social">

                <a href="https://www.instagram.com/visischile/"
                   target="_blank">
                    <i class="fa fa-instagram"></i>
                </a>

                <a href="https://www.facebook.com/visischile/"
                   target="_blank">
                    <i class="fa fa-facebook"></i>
                </a>

                <a href="https://open.spotify.com/artist/0TGb2qqZrjKAz8vXI56uz2?si=ERoMoaADSImu8hCf9hDaYA"
                   target="_blank">
                    <i class="fa fa-spotify"></i>
                </a>

            </div>

        </section>
        <!-- LOGO GOBIERNO -->
        <hr>

        <img
            src="img/logo-cultura.svg"
            alt="Gobierno de Chile"
            class="logo-gobierno">
        <hr>

        <!-- ESTUDIO -->

        <section class="section">

            <img
                src="img/logo-monteranco.svg"
                alt="MonteRanco"
                class="logo-estudio">

            <p class="social-title">Sigue nuestras redes</p>

            <div class="social">

                <a href="https://www.youtube.com/@monterancosesiones2716/videos"
                   target="_blank">
                    <i class="fa fa-youtube-play"></i>
                </a>

                <a href="https://www.instagram.com/monteranco_"
                   target="_blank">
                    <i class="fa fa-instagram"></i>
                </a>

                <a href="https://www.facebook.com/monteranco"
                   target="_blank">
                    <i class="fa fa-facebook"></i>
                </a>

                <a href="https://open.spotify.com/show/5YawREk2jIHfMY0jtlgysS?si=8f9bde5aa3aa4d43"
                   target="_blank">
                    <i class="fa fa-spotify"></i>
                </a>

            </div>

        </section>


    </div>

</body>
</html>
